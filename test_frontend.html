<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uji Coba API TeacherDesk</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: auto; }
        .box { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; border-radius: 5px; }
        pre { background: #eee; padding: 10px; overflow-x: auto; border-radius: 4px; }
        button { padding: 8px 15px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Panel Uji Coba API (Simulasi Frontend)</h2>
    
    <div class="box">
        <h3>1. Uji Coba Chatbot Konsultasi</h3>
        <input type="text" id="chatInput" placeholder="Tanya sesuatu tentang kurikulum..." style="width: 70%; padding: 8px;">
        <button onclick="testChat()">Kirim Pesan</button>
        <p><strong>Response API:</strong></p>
        <pre id="chatResult">Belum ada data...</pre>
    </div>

    <div class="box">
        <h3>2. Uji Coba Upload PDF & Generate Soal</h3>
        <input type="file" id="pdfInput" accept="application/pdf">
        <button onclick="testUpload()">Upload & Buat Soal</button>
        <p><strong>Response API:</strong></p>
        <pre id="uploadResult">Belum ada data...</pre>
    </div>

    <script>
        async function testChat() {
            const input = document.getElementById('chatInput').value;
            const resultBox = document.getElementById('chatResult');
            
            if (!input) return alert("Ketik pesan dulu!");
            resultBox.innerText = "Mengirim pesan ke API... Mohon tunggu.";

            const payload = {
                messages: [
                    { role: "system", content: "Kamu adalah asisten pengajar LMS." },
                    { role: "user", content: input }
                ]
            };

            try {
                const response = await fetch('api_chat.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                resultBox.innerText = JSON.stringify(data, null, 2);
            } catch (error) {
                resultBox.innerText = "Error: " + error.message;
            }
        }

        async function testUpload() {
            const fileInput = document.getElementById('pdfInput');
            const resultBox = document.getElementById('uploadResult');
            
            if (fileInput.files.length === 0) return alert("Pilih file PDF dulu!");
            resultBox.innerText = "Mengunggah dan membaca PDF... AI sedang membuat soal.";

            const formData = new FormData();
            formData.append('document', fileInput.files[0]);

            try {
                const response = await fetch('api_generate_mcq.php', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                resultBox.innerText = JSON.stringify(data, null, 2);
            } catch (error) {
                resultBox.innerText = "Error: " + error.message;
            }
        }
    </script>
</body>
</html>
